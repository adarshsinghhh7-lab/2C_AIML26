<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        class BankAccount {
            constructor(accountNo, holderName, balance) {
                this.accountNo = accountNo;
                this.holderName = holderName;
                this.balance = balance;
            }
            deposit(amount) {
                this.balance += amount;
                console.log(`${amount}deposited successfully`);
            }
            withdraw(amount) {
                if (amount > this.balance)
                    console.log("insufficient balance.");
                else
                    this.balance -= amount;
                console.log(`${amount} withdrawn successfully.`);
            }
            displayBalance() {
                console.log(`Account No: ${this.accountNo}, Holder: ${this.holderName}, Balance: ${this.balance}`);
            }
            static bankInfo() {
                console.log("Bank Name: ABC Bank");
                console.log("General Information: We provide safe and reliable banking services.");
            }
        }
        BankAccount.bankInfo();
        const account1 = new BankAccount(101, "Adarsh", 5000);
        const account2 = new BankAccount(102, "Abhay", 3000);
        account1.displayBalance();
        account1.deposit(1500);
        account1.withdraw(2000);
        account1.displayBalance();
        account2.displayBalance();
        account2.withdraw(4000);
        account2.deposit(1000);
        account2.withdraw(500);
        account2.displayBalance();

    </script>
</head>

<body>

</body>

</html>
