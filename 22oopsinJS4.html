<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    class Product {
        constructor(productId, productName, price) {
            this.productId = productId;
            this.productName = productName;
            this.price = price;
        }
       getDiscountedPrice(discount) {
            return this.price - (this.price * discount / 100);
        }

        display() {
            console.log(`Product ID: ${this.productId}`);
            console.log(`Product Name: ${this.productName}`);
            console.log(`Price: ₹${this.price}`);
        }

        static compareProducts(p1, p2) {
            const expensiveProduct = p1.price > p2.price ? p1 : p2;

            console.log("Product with higher price:");
            expensiveProduct.display();
        }
    }

    class Electronics extends Product {
        constructor(productId, productName, price, warranty) {
            super(productId, productName, price);
            this.warranty = warranty;
        }

        display() {
            super.display();
            console.log(`Warranty: ${this.warranty} years`);
        }
    }

    const product1 = new Product(101, "Keyboard", 1500);
    const product2 = new Electronics(102, "Laptop", 65000, 2);

    product1.display();

    console.log(`Discounted Price: ₹${product1.getDiscountedPrice(10)}`);

    console.log("\nElectronics Product:");
    product2.display();

    console.log("\nComparing Products:");
    Product.compareProducts(product1, product2);
</script>

<body>

</body>

</html>
