<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        class Student {
            constructor(rollNo, name, marks) {
                this.rollNo = rollNo;
                this.name = name;
                this.marks = marks;
            }
            displayResult() {
                console.log("Roll No:", this.rollNo);
                console.log("Name:", this.name);
                console.log("Marks:", this.marks);
                if (this.marks >= 40)
                    console.log("pass");
                else
                    console.log("fail");
            }
        }
        let student1 = new Student(12, "Adarsh", 80);
        let student2 = new Student(6, "Abhay", 30);
        let student3 = new Student(43, "Aryan", 1);
        student1.displayResult();
        student2.displayResult();
        student3.displayResult();
    </script>
</head>
