<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function info() {
            let a = parseInt(prompt("Enter value of a:"));
            if (a >= 18) {
                alert("You are eligible for voting");
            }
            else {
                alert("You are not eligible for voting");
            }
        }
    </script>
</head>

<body>
    <input type="button" onclick="info()" value="Result">

</body>

</html>
