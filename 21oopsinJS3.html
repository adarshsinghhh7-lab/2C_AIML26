<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        class Employee {
            constructor(id, name, basicSalary) {
                this.id = id;
                this.name = name;
                this.basicSalary = basicSalary;
            }

            calculateSalary() {
                return this.basicSalary;
            }
        }

        class Manager extends Employee {
            constructor(id, name, basicSalary, incentive) {
                super(id, name, basicSalary);
                this.incentive = incentive;
            }

            calculateSalary() {
                return this.basicSalary + this.incentive;
            }
        }
        const employee1 = new Employee(101, "Adarsh", 30000);
        const manager1 = new Manager(102, "Rahul", 50000, 10000);
        console.log(`Employee: ${employee1.name}`);
        console.log(`Salary: ${employee1.calculateSalary()}`);

        console.log(`Manager: ${manager1.name}`);
        console.log(`Salary: ${manager1.calculateSalary()}`);
    </script>
</head>

<body>

</body>

</html>
